<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Product preview card component</title>

</head>
<body>
  <main>
<article class="product-card">
  <picture>
    <source media="(min-width: 700px)" srcset="assets/images/image-product-desktop.jpg">
    <img src="assets/images/image-product-mobile.jpg" class="product-card__img" width="350" height="342" alt="Perfume bottle on a light surface with green leaves">
 </picture>
  <div class="product-card__content">
    <p class="product-card__category">PERFUME</p>       
    <h1 class="product-card__title">Gabrielle Essence Eau De Parfum</h1>
    <p class="product-card__description">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>        
    <div class="product-card__price">
      <p class="product-card__current-price">$149.99</p>      
      <s class="product-card__original-price">$169.99</s>      
    </div>
    <button class="product-card__button"><img src="./assets/images/icon-cart.svg" alt=""> Add to Cart</button>
  </div>
</article>
 </main>
</body>
</html>
